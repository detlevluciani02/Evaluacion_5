<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colletions - Registro de Coleccionistas de Baloncesto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-dark">🏀 Colletions</h1>
            <p class="text-muted">Venta y canje exclusivo de barajitas de baloncesto</p>
        </div>
        
        <!-- Formulario -->
        <div class="card p-4 shadow-sm mb-4">
            <h4 class="mb-3">Registro de Cliente / Coleccionista</h4>
            <form id="clienteForm">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Michael Jordan Fan" required>
                </div>
                <div class="mb-3">
                    <label for="edad" class="form-label">Edad</label>
                    <input type="number" class="form-control" id="edad" min="1" placeholder="Ej. 22" required>
                </div>
                <div class="mb-3">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <input type="text" class="form-control" id="ciudad" placeholder="Ej. Chicago" required>
                </div>
                <button type="submit" class="btn btn-dark w-100">Registrarme en Colletions</button>
            </form>
        </div>

        <!-- Respuesta Dinámica -->
        <div id="resultadoAlerta" class="alert d-none" role="alert"></div>

        <!-- Historial -->
        <div class="card p-4 shadow-sm">
            <h4>Coleccionistas Registrados Recientemente</h4>
            <ul id="listaClientes" class="list-group mt-3">
                <!-- Se llena dinámicamente con JS -->
            </ul>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
